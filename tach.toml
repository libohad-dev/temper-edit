exclude = ["**/__pycache__", "build/", "dist/", ".venv/", "tests/"]
source_roots = ["src"]

[[modules]]
path = "temper_edit.base_model"
depends_on = []

[[modules]]
path = "temper_edit.exceptions"
depends_on = []

[[modules]]
path = "temper_edit.config"
depends_on = [
    # keep-sorted start
    "temper_edit.base_model",
    # keep-sorted end
]

[[modules]]
path = "temper_edit.editor"
depends_on = [
    # keep-sorted start
    "temper_edit.config",
    "temper_edit.exceptions",
    # keep-sorted end
]

[[modules]]
path = "temper_edit.atomic_edit"
depends_on = []

[[modules]]
path = "temper_edit.cli"
depends_on = [
    # keep-sorted start
    "temper_edit.atomic_edit",
    "temper_edit.config",
    "temper_edit.editor",
    # keep-sorted end
]
